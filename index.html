<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DailyBudget — Personal Finance Tracker</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#14213d;--mu:#667085;--b:#12306b;--bt:#fff;--g:#1a8f5f;--r:#d03b3b;--y:#c98a12;--bd:#e1e6ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme=light])[data-t=dark],[data-t=dark]{--bg:#0d1526;--c:#15203a;--t:#e8edf7;--mu:#9aa7bf;--b:#7aa5ff;--bt:#0d1526;--g:#3ecf8e;--r:#ff6b6b;--y:#f0b64a;--bd:#26344f}
*{box-sizing:border-box}html,body{height:auto}body{margin:0;display:flex;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
aside{width:220px;background:var(--c);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 8px 14px;color:var(--b)}
aside a{padding:9px 12px;border-radius:8px;color:var(--t);text-decoration:none;font-weight:500;white-space:nowrap}aside a:hover{background:var(--bg)}aside a.on{background:var(--b);color:var(--bt)}
main{flex:1;min-width:0;padding:26px 28px 40px;max-width:1100px}h1{margin:0 0 18px;font-size:24px}h2{font-size:17px;margin:0 0 10px}
.gr{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cd{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:16px;min-width:0}.cd small,.mu{color:var(--mu)}.big{font-size:24px;font-weight:700}.g{color:var(--g)}.r{color:var(--r)}
.bt{border:1px solid var(--bd);background:var(--c);color:var(--t);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}.bt.p{background:var(--b);color:var(--bt);border-color:var(--b)}.bt.d{background:var(--r);color:#fff;border-color:var(--r)}.bt.s{padding:3px 9px;font-size:13px}
input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}input[type=checkbox]{width:auto}
label{display:block;margin-bottom:10px;font-size:14px;font-weight:500}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row>*{width:auto;flex:0 1 auto}.row input[type=search]{flex:1 1 180px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}td small{display:block;color:var(--mu)}.sc{overflow-x:auto}
.pb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.md{background:var(--c);border-radius:14px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto}
.ra{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.er{color:var(--r);margin:0 0 8px}.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bd)}.hb{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:5px 0}.hb div{height:12px;background:var(--bd);border-radius:6px}.hb i{display:block;height:100%;background:var(--b);border-radius:6px}
#t{position:fixed;right:16px;top:16px;background:var(--b);color:var(--bt);padding:10px 16px;border-radius:10px;z-index:99;display:none;max-width:320px}
.al{padding:12px 14px;border-radius:10px;margin-bottom:14px;border:1px solid var(--bd);background:var(--c)}
@media(max-width:800px){body{display:block}aside{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;border-top:1px solid var(--bd);border-right:0}.lg{display:none}main{padding:18px 14px 90px}.hb{grid-template-columns:90px 1fr 60px}}
</style></head><body>
<aside id="nav" aria-label="Main navigation"><div class="lg"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#12306b"/><rect x="6" y="16" width="4" height="8" rx="1" fill="#fff"/><rect x="13" y="11" width="4" height="13" rx="1" fill="#fff"/><rect x="20" y="6" width="4" height="18" rx="1" fill="#2fc48d"/></svg>DailyBudget</div></aside>
<main id="v"></main><div id="m"></div><div id="t" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),T=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Math.random().toString(36).slice(2,9);
const D={tx:[],bills:[],goals:[],bud:{},set:{cur:'USD',daily:50,roll:false,theme:'light'}};let S;
try{S=JSON.parse(localStorage.getItem('db'))}catch(e){}S=Object.assign({},D,S||{});S.set=Object.assign({},D.set,S.set);
const save=()=>{try{localStorage.setItem('db',JSON.stringify(S))}catch(e){}};
const CE=['Rent or mortgage','Groceries','Restaurants & food','Transportation & fuel','Utilities (power, water, internet)','Phone bills','Healthcare','Education','Shopping','Family','Entertainment','Insurance','Debt payments','Business expenses','Miscellaneous'];
const SRC=['Salary','Business','Freelance','Gift','Other'],PM=['Cash','Debit card','Credit card','Bank transfer','Other'],RC=['once','weekly','monthly','annually'];
const BT={Rent:CE[0],Electricity:CE[4],Water:CE[4],Internet:CE[4],Phone:CE[5],Insurance:CE[11],'Loan payment':CE[12],'Credit card payment':null,Subscription:CE[10]};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:S.set.cur}).format(n||0);
const sm=a=>a.reduce((s,x)=>s+(+x.amount||0),0),mk=()=>T().slice(0,7),pm=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.toLocaleDateString('en-CA').slice(0,7)};
const ex=()=>S.tx.filter(x=>x.type=='expense'),inc=()=>S.tx.filter(x=>x.type=='income'),dayEx=d=>sm(ex().filter(x=>x.date==d));
const saved=()=>sm(S.goals.map(g=>({amount:g.saved})));const bal=()=>sm(inc())-sm(ex())-saved();
const ago=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toLocaleDateString('en-CA')};
function avail(){let l=+S.set.daily||0;if(S.set.roll){const left=l-dayEx(ago(1));if(left>0)l+=left}return l}
const usedPct=()=>{const a=avail(),u=dayEx(T());return a>0?u/a*100:(u>0?101:0)};
const pb=p=>`<div class="pb" role="progressbar" aria-valuenow="${Math.min(100,Math.round(p))}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,p)}%;background:${p>100?'var(--r)':p>=80?'var(--y)':'var(--g)'}"></i></div>`;
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}
function modal(t,b){$('#m').innerHTML=`<div class="mo" onclick="if(event.target==this)cm()"><div class="md" role="dialog" aria-modal="true" aria-label="${esc(t)}"><h2>${esc(t)}</h2>${b}</div></div>`}
const cm=()=>$('#m').innerHTML='';let CB;
const cf=(msg,fn)=>{CB=fn;modal('Please confirm',`<p>${esc(msg)}</p><div class="ra"><button class="bt" onclick="cm()">Cancel</button><button class="bt d" onclick="CB();cm()">Delete</button></div>`)};
const fld=(n,l,t,v='',o)=>`<label>${l}`+(t=='select'?`<select name="${n}">${o.map(x=>`<option${x==v?' selected':''}>${esc(x)}</option>`).join('')}</select>`:t=='textarea'?`<textarea name="${n}" rows="2">${esc(v)}</textarea>`:t=='check'?` <input type="checkbox" name="${n}"${v?' checked':''}>`:`<input name="${n}" type="${t}" value="${esc(v)}"${t=='number'?' step="0.01" min="0.01" inputmode="decimal"':''}>`)+'</label>';
const btns=`<div class="ra"><button type="button" class="bt" onclick="cm()">Cancel</button><button class="bt p">Save</button></div>`;
const er=m=>{$('#er').textContent=m;return false};
function chk(f,k='amount'){const a=parseFloat(f[k]);if(!(a>0)||a>1e9)return'Enter an amount greater than 0.';return''}
const okd=d=>/^\d{4}-\d\d-\d\d$/.test(d)&&!isNaN(new Date(d));
/* ---- transactions ---- */
function txForm(type,id){const x=S.tx.find(t=>t.id==id)||{date:T(),essential:true};type=x.type||type;const i=type=='income';
modal((id?'Edit ':'Add ')+type,`<form onsubmit="return saveTx(event,'${type}','${id||''}')"><p id="er" class="er" role="alert"></p>`+fld('amount','Amount','number',x.amount)+fld('date',i?'Date received':'Date','date',x.date)+fld('category',i?'Income source':'Category','select',x.category||'',i?SRC:CE)+fld('desc','Description','text',x.desc)+fld('method','Payment method','select',x.method||'',PM)+(i?'':fld('essential','Essential expense','check',x.essential))+fld('notes','Notes (optional)','textarea',x.notes)+btns+'</form>')}
function saveTx(e,type,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),m=chk(f);if(m)return er(m);if(!okd(f.date))return er('Choose a valid date.');
const o={type,amount:Math.round(parseFloat(f.amount)*100)/100,date:f.date,category:f.category,desc:f.desc.trim(),method:f.method,notes:f.notes.trim(),essential:type=='expense'?!!f.essential:undefined};
const b=usedPct(),cb=bp(o.category);if(id)Object.assign(S.tx.find(t=>t.id==id),o);else S.tx.push({id:uid(),...o});save();cm();
let msg=id?'Transaction updated.':'Transaction saved.';if(type=='expense')msg+=alerts(b,o.category,cb);toast(msg);render();return false}
const bp=c=>S.bud[c]>0?sm(ex().filter(x=>x.category==c&&x.date.startsWith(mk())))/S.bud[c]*100:0;
function alerts(b,c,cb){let m='',a=usedPct();const u=dayEx(T()),L=avail();
if(a>100&&b<=100)m=` You've exceeded today's budget by ${fmt(u-L)}.`;else if(a>=100&&b<100)m=" You've reached today's budget.";else if(a>=80&&b<80)m=" You've used 80% of today's budget.";else if(a>=50&&b<50)m=" You've used 50% of today's budget.";
const n=bp(c);if(n>=100&&cb<100)m+=` ${c} budget exceeded.`;else if(n>=80&&cb<80)m+=` ${c} budget is ${Math.round(n)}% used.`;return m}
const delTx=id=>cf('Delete this transaction? This cannot be undone.',()=>{S.tx=S.tx.filter(t=>t.id!=id);save();toast('Transaction deleted.');render()});
const trow=x=>`<tr><td>${x.date}</td><td>${esc(x.desc||x.category)}<small>${esc(x.category)} · ${esc(x.method||'')}${x.type=='expense'&&!x.essential?' · non-essential':''}</small></td><td class="${x.type=='income'?'g':'r'}">${x.type=='income'?'+':'−'}${fmt(x.amount)}</td><td><button class="bt s" onclick="txForm('','${x.id}')" aria-label="Edit">Edit</button> <button class="bt s" onclick="delTx('${x.id}')" aria-label="Delete">Delete</button></td></tr>`;
const empty=(m,b='')=>`<div class="cd" style="text-align:center;padding:30px"><p class="mu">${m}</p>${b}</div>`;
const tbl=a=>a.length?`<div class="sc"><table><thead><tr><th>Date</th><th>Details</th><th>Amount</th><th></th></tr></thead><tbody>${a.map(trow).join('')}</tbody></table></div>`:empty('No transactions to show.');
/* ---- charts ---- */
function bars(it,two){if(!it.length)return'<p class="mu">No data yet.</p>';const m=Math.max(1,...it.flatMap(x=>[x.v,x.w||0])),W=Math.max(300,it.length*(two?46:30)),H=130,bw=W/it.length;
return`<div class="sc"><svg viewBox="0 0 ${W} ${H+20}" style="min-width:${W}px;width:100%" role="img" aria-label="Bar chart">`+it.map((x,i)=>{const h=x.v/m*H,k=two?bw/2-3:bw-8;return`<rect x="${i*bw+3}" y="${H-h}" width="${k}" height="${h}" rx="2" fill="${two?'var(--r)':'var(--b)'}"><title>${esc(x.l)}: ${fmt(x.v)}</title></rect>`+(two?`<rect x="${i*bw+bw/2}" y="${H-x.w/m*H}" width="${k}" height="${x.w/m*H}" rx="2" fill="var(--g)"><title>${esc(x.l)} income: ${fmt(x.w)}</title></rect>`:'')+`<text x="${i*bw+bw/2}" y="${H+14}" text-anchor="middle" font-size="10" fill="currentColor">${esc(x.l)}</text>`}).join('')+'</svg></div>'}
const hb=it=>it.length?it.map(x=>`<div class="hb"><span>${esc(x.l)}</span><div><i style="width:${x.v/Math.max(1,...it.map(y=>y.v))*100}%"></i></div><b>${fmt(x.v)}</b></div>`).join(''):'<p class="mu">No data yet.</p>';
const bycat=a=>Object.entries(a.reduce((o,x)=>(o[x.category]=(o[x.category]||0)+x.amount,o),{})).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v);
const days=n=>Array.from({length:n},(_,i)=>ago(n-1-i));
/* ---- pages ---- */
const R={};const cdv=(l,v,c='')=>`<div class="cd"><small>${l}</small><div class="big ${c}">${v}</div></div>`;
const addBtns=`<div class="row"><button class="bt p" onclick="txForm('expense')">+ Add expense</button><button class="bt" onclick="txForm('income')">+ Add income</button></div>`;
R.Dashboard=()=>{if(!S.tx.length&&!S.bills.length&&!S.goals.length)return`<h1>Dashboard</h1>`+empty('Welcome! Add your first income or expense to get started, or explore with sample data.',addBtns+'<button class="bt" onclick="demo()">Load sample data</button>');
const m=mk(),mi=sm(inc().filter(x=>x.date.startsWith(m))),me=sm(ex().filter(x=>x.date.startsWith(m))),t=T(),rem=avail()-dayEx(t),up=S.bills.filter(b=>!b.paid).sort((a,b)=>a.due>b.due?1:-1).slice(0,5);
return`<h1>Dashboard</h1>${addBtns}<div class="gr">${cdv('Total balance',fmt(bal()),bal()<0?'r':'')}${cdv("Today's income",fmt(sm(inc().filter(x=>x.date==t))),'g')}${cdv("Today's expenses",fmt(dayEx(t)))}${cdv('Remaining daily budget',fmt(rem),rem<0?'r':'g')}${cdv('Income this month',fmt(mi),'g')}${cdv('Expenses this month',fmt(me))}${cdv('Total savings',fmt(saved()),'g')}</div>
<div class="gr g2"><div class="cd"><h2>Upcoming bills</h2>${up.length?up.map(b=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${esc(b.name)}<br><small class="mu">Due ${b.due}</small></span><span>${fmt(b.amount)} ${b.due<t?'<span class="tag r">Overdue</span>':''}</span></div>`).join(''):'<p class="mu">No unpaid bills.</p>'}</div>
<div class="cd"><h2>Spending this month by category</h2>${hb(bycat(ex().filter(x=>x.date.startsWith(m))).slice(0,6))}</div></div>
<div class="cd" style="margin-bottom:16px"><h2>Daily spending — last 14 days</h2>${bars(days(14).map(d=>({l:d.slice(8),v:dayEx(d)})))}</div>
<div class="cd"><h2>Recent transactions</h2>${tbl([...S.tx].sort((a,b)=>a.date<b.date?1:-1).slice(0,8))}</div>`};
let F={q:'',type:'',cat:'',from:'',to:''};
const filt=()=>S.tx.filter(x=>(!F.type||x.type==F.type)&&(!F.cat||x.category==F.cat)&&(!F.from||x.date>=F.from)&&(!F.to||x.date<=F.to)&&(!F.q||(x.desc+x.category+(x.notes||'')).toLowerCase().includes(F.q.toLowerCase()))).sort((a,b)=>a.date<b.date?1:-1);
const fl=(k,v)=>{F[k]=v;$('#tl').innerHTML=tbl(filt())};
R.Transactions=()=>`<h1>Transactions</h1>${addBtns}<div class="row"><input type="search" placeholder="Search…" aria-label="Search" value="${esc(F.q)}" oninput="fl('q',this.value)"><select aria-label="Type" onchange="fl('type',this.value)"><option value="">All types</option><option value="income"${F.type=='income'?' selected':''}>Income</option><option value="expense"${F.type=='expense'?' selected':''}>Expense</option></select><select aria-label="Category" onchange="fl('cat',this.value)"><option value="">All categories</option>${[...SRC,...CE].map(c=>`<option${F.cat==c?' selected':''}>${esc(c)}</option>`).join('')}</select><input type="date" aria-label="From" value="${F.from}" onchange="fl('from',this.value)"><input type="date" aria-label="To" value="${F.to}" onchange="fl('to',this.value)"></div><div class="cd" id="tl">${tbl(filt())}</div>`;
R['Daily Budget']=()=>{const a=avail(),u=dayEx(T()),p=usedPct(),r=a-u,w=S.set.roll?`Rollover is on: unused budget from yesterday is added to today's limit (${fmt(a-S.set.daily)} carried).`:'Rollover is off: unused budget does not carry over.';
const msg=p>100?`You've exceeded today's budget by ${fmt(-r)}.`:p>=100?"You've reached today's budget.":p>=80?"Heads up — 80% of today's budget is spent.":p>=50?'You have spent over half of today\'s budget.':'You are within today\'s budget.';
return`<h1>Daily Budget</h1><div class="al" role="status"><b>${msg}</b></div><div class="cd" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><span>Used ${fmt(u)} of ${fmt(a)}</span><b class="${r<0?'r':'g'}">${fmt(r)} left</b></div>${pb(p)}<small class="mu">${a>0?Math.round(u/a*100):0}% used · ${w}</small></div>
<form class="cd" onsubmit="return setDaily(event)"><h2>Daily spending limit</h2><p id="er" class="er" role="alert"></p>${fld('daily','Limit per day','number',S.set.daily)}${fld('roll','Roll unused budget over to the next day','check',S.set.roll)}<button class="bt p">Save</button></form><div class="cd" style="margin-top:16px"><h2>Today's expenses</h2>${tbl(ex().filter(x=>x.date==T()))}</div>`};
function setDaily(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),a=parseFloat(f.daily);if(!(a>=0))return er('Enter 0 or more.');S.set.daily=a;S.set.roll=!!f.roll;save();toast('Daily budget saved.');render();return false}
R['Monthly Budget']=()=>{const m=mk();return`<h1>Monthly Budget</h1><p class="mu">Set a limit for each category. Alerts appear at 80% and 100%.</p><div class="cd sc"><table><thead><tr><th>Category</th><th>Planned</th><th>Spent</th><th>Remaining</th></tr></thead><tbody>${CE.map(c=>{const s=sm(ex().filter(x=>x.category==c&&x.date.startsWith(m))),b=S.bud[c]||0,p=b>0?s/b*100:0;return`<tr><td>${esc(c)}${b?pb(p):''}${p>=100?'<small class="r">Over budget</small>':p>=80?'<small style="color:var(--y)">Approaching limit</small>':''}</td><td><input type="number" min="0" step="1" style="width:90px" aria-label="${esc(c)} budget" value="${b||''}" onchange="setBud('${esc(c).replace(/'/g,"\\'")}',this.value)"></td><td>${fmt(s)}</td><td class="${b&&b-s<0?'r':''}">${b?fmt(b-s):'—'}</td></tr>`}).join('')}</tbody></table></div>`};
function setBud(c,v){const n=parseFloat(v);if(v!==''&&!(n>=0)){toast('Enter a valid amount.');return}if(v==='')delete S.bud[c];else S.bud[c]=n;save();render()}
/* bills */
const addRec=(d,r)=>{const x=new Date(d+'T00:00');r=='weekly'?x.setDate(x.getDate()+7):r=='monthly'?x.setMonth(x.getMonth()+1):x.setFullYear(x.getFullYear()+1);return x.toLocaleDateString('en-CA')};
function billForm(id){const b=S.bills.find(x=>x.id==id)||{due:T(),rec:'monthly'};modal(id?'Edit bill':'Add bill',`<form onsubmit="return saveBill(event,'${id||''}')"><p id="er" class="er" role="alert"></p>`+fld('name','Name','text',b.name)+fld('type','Type','select',b.type||'',Object.keys(BT))+fld('amount','Amount','number',b.amount)+fld('due','Due date','date',b.due)+fld('rec','Recurrence','select',b.rec,RC)+btns+'</form>')}
function saveBill(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),m=chk(f);if(!f.name.trim())return er('Enter a name.');if(m)return er(m);if(!okd(f.due))return er('Choose a valid due date.');
const o={name:f.name.trim(),type:f.type,amount:Math.round(parseFloat(f.amount)*100)/100,due:f.due,rec:f.rec};if(id)Object.assign(S.bills.find(b=>b.id==id),o);else S.bills.push({id:uid(),paid:false,...o});save();cm();toast('Bill saved.');render();return false}
function pay(id){const b=S.bills.find(x=>x.id==id),c=BT[b.type];if(c)S.tx.push({id:uid(),type:'expense',amount:b.amount,date:T(),category:c,desc:b.name+' (bill)',method:'Bank transfer',essential:true,notes:''});b.last=T();b.rec=='once'?b.paid=true:b.due=addRec(b.due,b.rec);save();toast(c?'Bill paid and recorded as an expense.':'Payment marked. Credit card payments are not counted as new expenses.');render()}
const delBill=id=>cf('Delete this bill?',()=>{S.bills=S.bills.filter(b=>b.id!=id);save();toast('Bill deleted.');render()});
const brow=b=>`<tr><td>${esc(b.name)}<small>${esc(b.type)} · ${b.rec}</small></td><td>${b.paid?'Paid '+b.last:'Due '+b.due}${!b.paid&&b.due<T()?' <span class="tag r">Overdue</span>':''}</td><td>${fmt(b.amount)}</td><td>${b.paid?'':`<button class="bt s" onclick="pay('${b.id}')">Mark paid</button> `}<button class="bt s" onclick="billForm('${b.id}')">Edit</button> <button class="bt s" onclick="delBill('${b.id}')">Delete</button></td></tr>`;
R.Bills=()=>{const t=T(),u=S.bills.filter(b=>!b.paid),sec=(h,a)=>`<div class="cd sc" style="margin-bottom:14px"><h2>${h}</h2>${a.length?`<table><tbody>${a.map(brow).join('')}</tbody></table>`:'<p class="mu">None.</p>'}</div>`;
return`<h1>Bills</h1><div class="row"><button class="bt p" onclick="billForm()">+ Add bill</button></div>`+(S.bills.length?sec('Overdue',u.filter(b=>b.due<t))+sec('Upcoming',u.filter(b=>b.due>=t).sort((a,b)=>a.due>b.due?1:-1))+sec('Paid (one-time)',S.bills.filter(b=>b.paid))+(S.bills.some(b=>!b.paid&&b.last)?'<p class="mu">Recurring bills move to their next due date when paid.</p>':''):empty('No bills yet. Add rent, utilities, subscriptions and more.'))};
/* savings */
function goalForm(id){const g=S.goals.find(x=>x.id==id)||{};modal(id?'Edit goal':'New savings goal',`<form onsubmit="return saveGoal(event,'${id||''}')"><p id="er" class="er" role="alert"></p>`+fld('name','Goal (e.g. Emergency fund, House, Car, Vacation, Education)','text',g.name)+fld('target','Target amount','number',g.target)+fld('date','Target date','date',g.date||'')+btns+'</form>')}
function saveGoal(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),m=chk(f,'target');if(!f.name.trim())return er('Enter a goal name.');if(m)return er(m);if(f.date&&!okd(f.date))return er('Choose a valid date.');const o={name:f.name.trim(),target:parseFloat(f.target),date:f.date};
if(id)Object.assign(S.goals.find(g=>g.id==id),o);else S.goals.push({id:uid(),saved:0,hist:[],...o});save();cm();toast('Goal saved.');render();return false}
const fundForm=id=>modal('Add to savings',`<form onsubmit="return fund(event,'${id}')"><p id="er" class="er" role="alert"></p>${fld('amount','Amount','number','')}${btns}</form>`);
function fund(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),m=chk(f);if(m)return er(m);const g=S.goals.find(x=>x.id==id),a=Math.round(parseFloat(f.amount)*100)/100;g.saved=Math.round((g.saved+a)*100)/100;g.hist.push({d:T(),a});save();cm();toast('Savings added.');render();return false}
const delGoal=id=>cf('Delete this goal and its saved amount?',()=>{S.goals=S.goals.filter(g=>g.id!=id);save();toast('Goal deleted.');render()});
R.Savings=()=>`<h1>Savings Goals</h1><div class="row"><button class="bt p" onclick="goalForm()">+ New goal</button><span class="mu">Total saved: <b class="g">${fmt(saved())}</b></span></div>`+(S.goals.length?`<div class="gr">${S.goals.map(g=>{const p=g.target?g.saved/g.target*100:0;return`<div class="cd"><h2>${esc(g.name)}</h2>${pb(p)}<b>${Math.round(p)}%</b> · ${fmt(g.saved)} of ${fmt(g.target)}<br><small class="mu">Remaining ${fmt(Math.max(0,g.target-g.saved))}${g.date?' · Target '+g.date:''}</small><div class="row" style="margin:10px 0 0"><button class="bt s p" onclick="fundForm('${g.id}')">Add funds</button><button class="bt s" onclick="goalForm('${g.id}')">Edit</button><button class="bt s" onclick="delGoal('${g.id}')">Delete</button></div></div>`}).join('')}</div>`:empty('No savings goals yet. Create one to start tracking.'));
/* reports */
let RP={from:T().slice(0,8)+'01',to:T()};
const inR=x=>x.date>=RP.from&&x.date<=RP.to,rp=(k,v)=>{RP[k]=v;render()};
function wk(d){const x=new Date(d+'T00:00'),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x.toLocaleDateString('en-CA')}
R.Reports=()=>{const e=ex().filter(inR),i=inc().filter(inR);let dd=[];for(let d=new Date(RP.from+'T00:00'),n=0;d<=new Date(RP.to+'T00:00')&&n<92;d.setDate(d.getDate()+1),n++)dd.push(d.toLocaleDateString('en-CA'));
const W={};e.forEach(x=>{const k=wk(x.date);W[k]=(W[k]||0)+x.amount});const M={};[...e.map(x=>[x,'v']),...i.map(x=>[x,'w'])].forEach(([x,k])=>{const m=x.date.slice(0,7);M[m]=M[m]||{v:0,w:0};M[m][k]+=x.amount});
const cur=mk(),bv=Object.keys(S.bud).map(c=>({c,b:S.bud[c],a:sm(ex().filter(x=>x.category==c&&x.date.startsWith(cur)))}));let cum=0;const sg=S.goals.flatMap(g=>g.hist).sort((a,b)=>a.d>b.d?1:-1).map(h=>({l:h.d.slice(5),v:cum+=h.a}));
return`<h1>Reports</h1><div class="row"><label style="margin:0">From <input type="date" value="${RP.from}" onchange="rp('from',this.value)"></label><label style="margin:0">To <input type="date" value="${RP.to}" onchange="rp('to',this.value)"></label><button class="bt" onclick="expCSV(true)">Export CSV</button></div>
<div class="gr g2"><div class="cd"><h2>Daily expenses</h2>${bars(dd.map(d=>({l:d.slice(5),v:dayEx(d)})))}</div><div class="cd"><h2>Weekly expenses (week starting)</h2>${bars(Object.entries(W).sort().map(([l,v])=>({l:l.slice(5),v})))}</div>
<div class="cd"><h2>Income vs expenses by month <small class="mu">(red = expenses, green = income)</small></h2>${bars(Object.entries(M).sort().map(([l,o])=>({l,v:o.v,w:o.w})),1)}</div><div class="cd"><h2>Spending by category / highest categories</h2>${hb(bycat(e))}</div>
<div class="cd"><h2>Budget vs actual (this month)</h2>${bv.length?bv.map(x=>`<div class="mu">${esc(x.c)}: ${fmt(x.a)} of ${fmt(x.b)}</div>${pb(x.b?x.a/x.b*100:0)}`).join(''):'<p class="mu">Set category budgets to compare.</p>'}</div><div class="cd"><h2>Savings growth</h2>${bars(sg)}</div></div>
<div class="cd" style="margin-top:16px"><h2>Insights</h2>${insights()}</div>`};
function insights(){const o=[],m=mk(),p=pm(),ca=c=>sm(ex().filter(x=>x.category==c&&x.date.startsWith(c==c?m:'')));
CE.forEach(c=>{const a=sm(ex().filter(x=>x.category==c&&x.date.startsWith(m))),b=sm(ex().filter(x=>x.category==c&&x.date.startsWith(p)));if(b>0&&a-b>=1)o.push(`You spent ${fmt(a-b)} more on ${c} this month than last month.`);const q=bp(c);if(q>=80)o.push(`You have used ${Math.round(q)}% of your ${c} budget.`)});
const ne=sm(ex().filter(x=>!x.essential&&x.date.startsWith(m)));if(ne>0)o.push(`Non-essential spending this month is ${fmt(ne)}. Cutting it by 10% would save about ${fmt(ne*.1)}.`);
const od=S.bills.filter(b=>!b.paid&&b.due<T()).length;if(od)o.push(`You have ${od} overdue bill${od>1?'s':''}.`);return o.length?'<ul>'+o.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p class="mu">Add more transactions to see insights based on your own data.</p>'}
/* data tools */
const csvOf=a=>'Date,Type,Category,Description,Amount,Payment method,Essential,Notes\n'+a.map(x=>[x.date,x.type,x.category,x.desc,x.amount,x.method,x.type=='expense'?(x.essential?'yes':'no'):'',x.notes].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
function out(title,text,file){modal(title,`<p class="mu">Copy this text and save it in a file named <b>${file}</b>, or try Download.</p><textarea id="ot" rows="9" readonly onfocus="this.select()">${esc(text)}</textarea><div class="ra"><button class="bt" onclick="cm()">Close</button><button class="bt" onclick="dl('${file}')">Download</button><button class="bt p" onclick="cp()">Copy</button></div>`)}
const cp=()=>{const t=$('#ot');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied.'),()=>{document.execCommand('copy');toast('Copied.')})}catch(e){document.execCommand('copy');toast('Copied.')}};
function dl(f){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#ot').value]));a.download=f;a.click();toast('If nothing downloaded, use Copy instead.')}
const expCSV=r=>out('Export CSV',csvOf((r?S.tx.filter(inR):S.tx).sort((a,b)=>a.date>b.date?1:-1)),'dailybudget.csv');
const backup=()=>out('Backup (JSON)',JSON.stringify(S),'dailybudget-backup.json');
function restoreForm(){modal('Restore backup',`<form onsubmit="return restore(event)"><p id="er" class="er" role="alert"></p><p class="mu">Paste a backup. This replaces your current data.</p><textarea name="j" rows="8"></textarea>${btns}</form>`)}
function restore(e){e.preventDefault();try{const o=JSON.parse(new FormData(e.target).get('j'));if(!Array.isArray(o.tx)||!Array.isArray(o.bills)||!Array.isArray(o.goals))throw 0;S=Object.assign({},D,o);S.set=Object.assign({},D.set,o.set);save();cm();toast('Backup restored.');init()}catch(x){er('That does not look like a valid backup.')}return false}
function demo(){const E=[[0,2,11.5,'Lunch'],[0,1,48.2,'Weekly groceries'],[1,3,38,'Fuel'],[2,2,22,'Dinner out'],[3,8,64,'Clothes',0],[4,10,15,'Streaming',0],[5,1,71.3,'Groceries'],[6,6,35,'Pharmacy'],[8,2,29,'Takeout',0],[9,3,12,'Bus pass'],[10,1,55,'Groceries'],[12,10,40,'Movies',0],[14,2,34,'Dinner out',0],[20,1,80,'Groceries'],[24,2,41,'Lunch',0],[33,1,66,'Groceries'],[36,2,52,'Dinner out',0],[40,3,45,'Fuel']];
E.forEach(([n,c,a,d,es])=>S.tx.push({id:uid(),demo:1,type:'expense',amount:a,date:ago(n),category:CE[c],desc:d,method:'Debit card',essential:es!==0,notes:''}));
[[2,'Salary',2400,'Paycheck'],[12,'Freelance',350,'Design project'],[32,'Salary',2400,'Paycheck']].forEach(([n,c,a,d])=>S.tx.push({id:uid(),demo:1,type:'income',amount:a,date:ago(n),category:c,desc:d,method:'Bank transfer'}));
S.bills.push({id:uid(),demo:1,name:'Internet',type:'Internet',amount:60,due:ago(-4),rec:'monthly',paid:false},{id:uid(),demo:1,name:'Rent',type:'Rent',amount:1100,due:ago(-9),rec:'monthly',paid:false},{id:uid(),demo:1,name:'Phone',type:'Phone',amount:45,due:ago(2),rec:'monthly',paid:false});
S.goals.push({id:uid(),demo:1,name:'Emergency fund',target:3000,saved:600,date:'',hist:[{d:ago(20),a:300},{d:ago(5),a:300}]});S.dm=1;if(!Object.keys(S.bud).length)S.bud={[CE[1]]:300,[CE[2]]:150,[CE[3]]:200,[CE[10]]:100};save();toast('Sample data loaded. Clear it anytime in Settings.');render()}
const clrDemo=()=>cf('Remove all sample data? Your own entries stay.',()=>{S.tx=S.tx.filter(x=>!x.demo);S.bills=S.bills.filter(x=>!x.demo);S.goals=S.goals.filter(x=>!x.demo);if(S.dm){S.bud={};delete S.dm}save();toast('Sample data cleared.');render()});
const clrAll=()=>cf('Delete ALL your data? Consider making a backup first.',()=>{S=JSON.parse(JSON.stringify(D));save();toast('All data deleted.');render()});
const setS=(k,v)=>{S.set[k]=v;save();init()};
R.Settings=()=>`<h1>Settings</h1><div class="gr g2"><div class="cd"><h2>Appearance & currency</h2><label>Currency<select onchange="setS('cur',this.value)">${['USD','EUR','GBP','CAD','AUD'].map(c=>`<option${S.set.cur==c?' selected':''}>${c}</option>`).join('')}</select></label><label>Theme<select onchange="setS('theme',this.value)"><option value="light"${S.set.theme=='light'?' selected':''}>Light</option><option value="dark"${S.set.theme=='dark'?' selected':''}>Dark</option></select></label></div>
<div class="cd"><h2>Your data</h2><p class="mu">Saved in this browser only. Make backups regularly. No financial data is sent anywhere.</p><div class="row"><button class="bt" onclick="expCSV(false)">Export all CSV</button><button class="bt" onclick="backup()">Backup</button><button class="bt" onclick="restoreForm()">Restore</button></div><div class="row"><button class="bt" onclick="demo()">Load sample data</button><button class="bt" onclick="clrDemo()">Clear sample data</button><button class="bt d" onclick="clrAll()">Delete all data</button></div></div></div>`;
function render(){const p=decodeURIComponent(location.hash.slice(1))||'Dashboard',k=R[p]?p:'Dashboard';document.querySelectorAll('#nav a').forEach(a=>{a.classList.toggle('on',a.dataset.p==k);a.ariaCurrent=a.dataset.p==k?'page':null});$('#v').innerHTML=R[k]();document.title=k+' — DailyBudget'}
function init(){document.documentElement.dataset.t=S.set.theme;render()}
Object.keys(R).forEach(k=>$('#nav').insertAdjacentHTML('beforeend',`<a href="#${encodeURIComponent(k)}" data-p="${k}">${k}</a>`));
addEventListener('hashchange',render);addEventListener('keydown',e=>{if(e.key=='Escape')cm()});init();
</script></body></html>
